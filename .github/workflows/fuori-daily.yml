name: Daily site check

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily, off the hour to avoid GitHub's scheduling peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test www.fuori.co.uk
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        run: scripts/smoke-test.sh https://www.fuori.co.uk
